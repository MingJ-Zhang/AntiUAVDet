__include__: [
  './deimv2_hgnetv2_n_fdd_foggy.yml'
]

# High-resolution FDD baseline. All FDD images are 1920x1080; 768x1344 keeps
# the native geometry within 1.6% and both dimensions are divisible by 32.
output_dir: ./outputs/deimv2_hgnetv2_n_fdd_foggy_768x1344_300e_gpu2
eval_spatial_size: [768, 1344]

# Extend the original 160-epoch schedule to 300 epochs. Augmentation shutdown,
# the no-augmentation tail, and matcher transition retain their relative time.
epoches: 300
no_aug_epoch: 23

train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: [384, 672], rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [768, 1344]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 146, 278]
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.5
  collate_fn:
    mixup_epochs: [4, 146]
    stop_epoch: 278
    copyblend_epochs: [4, 146]

val_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [768, 1344]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}

DEIMCriterion:
  matcher:
    matcher_change_epoch: 255
