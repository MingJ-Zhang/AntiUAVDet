# AntiUAVDet model zoo — single source of truth.
# Paths are relative to the repository root. Checkpoints are NOT shipped;
# place them under weights/<id>/<dataset>.pth (or .pt for ultralytics).

project: AntiUAVDet
version: 0.1.0
img_size: [768, 1344]
datasets: [fdd, antiuav, dut_dve]

eval:
  score_thr: 0.001
  max_dets_per_image: 300
  coco7_names: [AP50:95, AP50, AP75, AP-s, AP-m, AP-l, AR100]

models:
  - id: faster_rcnn
    display: Faster R-CNN
    family: two-stage
    year: 2015
    paper: "Faster R-CNN: Towards Real-Time Object Detection with Region Proposal Networks"
    paper_url: https://arxiv.org/abs/1506.01497
    framework: mmdet
    repo: models/mmdet_baselines
    configs:
      fdd: configs/faster_rcnn/faster-rcnn_r50_fpn_1x_fdd_768x1344.py
      antiuav: configs/faster_rcnn/faster-rcnn_r50_fpn_1x_antiuav_768x1344.py
      dut_dve: configs/dut_dve/faster-rcnn_r50_fpn_dut_dve_200e_768x1344.py
    ckpts:
      fdd: ../../weights/faster_rcnn/fdd.pth
      antiuav: ../../weights/faster_rcnn/antiuav.pth
      dut_dve: ../../weights/faster_rcnn/dut_dve.pth
    best_epoch: {fdd: 30, antiuav: 18, dut_dve: 18}
    params_M: 41.35
    gflops: 207.94

  - id: retinanet
    display: RetinaNet
    family: one-stage
    year: 2017
    paper: "Focal Loss for Dense Object Detection"
    paper_url: https://arxiv.org/abs/1708.02002
    framework: mmdet
    repo: models/mmdet_baselines
    configs:
      fdd: configs/retinanet/retinanet_r50_fpn_1x_fdd_768x1344.py
      antiuav: configs/retinanet/retinanet_r50_fpn_1x_antiuav_768x1344.py
      dut_dve: configs/dut_dve/retinanet_r50_fpn_dut_dve_200e_768x1344.py
    ckpts:
      fdd: ../../weights/retinanet/fdd.pth
      antiuav: ../../weights/retinanet/antiuav.pth
      dut_dve: ../../weights/retinanet/dut_dve.pth
    best_epoch: {fdd: 204, antiuav: 216, dut_dve: 43}
    params_M: 36.33
    gflops: 205.56

