__include__: [
  './deimv2_dinov3_m_antiuav_768x1344_300e_gpu0.yml'
]
# Held-out Anti-UAV test evaluation for the completed 300-epoch run.
# Training settings are inherited unchanged; only evaluation data/output differ.
output_dir: ./outputs/deimv2_dinov3_m_antiuav_768x1344_300e_gpu0_seed0/test_eval_fp32
val_dataloader:
  total_batch_size: 16
  dataset:
    img_folder: ${ANTIUAVDET_DATA}/antiuav/test/test/img
    ann_file: ${ANTIUAVDET_DATA}/antiuav/annotations/instances_test.json
    transforms:
      ops:
        - {type: Resize, size: [768, 1344]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
