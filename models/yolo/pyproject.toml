[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdd-yolo-benchmark"
version = "0.1.0"
description = "FDD foggy-domain YOLO benchmark orchestration and unified COCO evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary orchestration code; see docs/THIRD_PARTY_LICENSES.md"}
dependencies = [
  "numpy==1.26.4",
  "PyYAML>=6.0.1,<6.1",
  "Pillow==11.1.0",
  "pycocotools==2.0.7",
  "matplotlib==3.10.0",
  "pandas==2.2.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.9.6", "pre-commit==4.1.0"]

[project.scripts]
fddbench = "fdd_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
